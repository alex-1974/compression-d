name: Compression contracts and codecs
on: [push, pull_request]
jobs:
  contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [dmd-2.111.0, ldc-1.42.0]
    steps:
      - uses: actions/checkout@v4
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}
      - name: Build library
        run: dub build --compiler="$DC"
      - name: Test contracts and compile attribute probes
        run: |
          mkdir -p .build
          "$DC" -dip1000 -w -unittest -Isource source/compression/core.d tests/core_probe.d -of=.build/core-probe
          .build/core-probe
      - name: Test bitstream and Huffman primitives
        run: |
          "$DC" -dip1000 -w -unittest -Isource source/compression/core.d source/compression/bitstream.d source/compression/huffman.d tests/huffman_tests.d tests/primitives_probe.d -of=.build/primitives-probe
          .build/primitives-probe
      - name: Test raw Inflate and attribute probes
        run: |
          "$DC" -dip1000 -w -unittest -Isource -Itests source/compression/core.d source/compression/bitstream.d source/compression/huffman.d source/compression/deflate.d tests/inflate_fixtures.d tests/inflate_tests.d tests/inflate_probe.d -of=.build/inflate-probe
          .build/inflate-probe
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Differential decode against zlib
        run: |
          "$DC" -O -Isource source/compression/core.d source/compression/bitstream.d source/compression/huffman.d source/compression/deflate.d scripts/inflate-oracle.d -of=.build/inflate-oracle
          python3 scripts/check-inflate-differential.py .build/inflate-oracle
      - name: Test checksums and framed streaming adapters against zlib
        run: bash scripts/check-framing.sh "$DC"
